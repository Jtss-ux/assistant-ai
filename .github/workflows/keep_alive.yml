name: Render Keep-Alive Heartbeat

on:
  # schedule:
  #   # Run every 5 minutes to beat Render's 15-minute timeout
  #   - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install httpx

      - name: Run Heartbeat
        env:
          RENDER_EXTERNAL_URL: https://assistant-ai-uqu4.onrender.com
        run: python scripts/heartbeat.py
